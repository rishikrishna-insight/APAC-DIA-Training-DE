models:
  - name: stg_orders_lines
    description: "Staging model for order line items - exact schema mapping from orders_lines_schema"
    
    tests:
      # FK violation rate monitoring for order_id -> stg_orders_header
      - fk_violation_rate:
          column_name: order_id
          to: ref('stg_orders_header')
          field: order_id
          max_violation_rate: 1.5
      
      # FK violation rate monitoring for product_id -> stg_products  
      - fk_violation_rate:
          column_name: product_id
          to: ref('stg_products')
          field: product_id
          max_violation_rate: 1.5

    columns:
      # Schema columns - exact mapping from orders_lines_schema
      - name: order_id
        data_type: bigint
        description: "Order identifier - FK to orders_header"
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders_header')
              field: order_id
              config:
                severity: warn

      - name: line_number
        data_type: integer
        description: "Line number within the order"
        tests:
          - not_null

      - name: product_id
        data_type: bigint
        description: "Product identifier - FK to products"
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
              config:
                severity: warn

      - name: qty
        data_type: integer
        description: "Quantity ordered"
        tests:
          - not_null

      - name: unit_price
        data_type: decimal(12,4)
        description: "Unit price of the product"
        tests:
          - not_null

      - name: line_discount_pct
        data_type: decimal(5,4)
        description: "Line discount percentage"
        tests:
          - discount_range:
              min_value: 0
              max_value: 100

      - name: tax_pct
        data_type: decimal(5,4)
        description: "Tax percentage"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1

      # Metadata columns (exceptions)
      - name: ingestion_ts
        data_type: timestamp
        description: "UTC timestamp when record was ingested"
        tests:
          - not_null

      - name: src_filename
        data_type: varchar
        description: "Source filename for traceability"


      - name: src_row_hash
        data_type: varchar
        description: "Hash of source row for change detection"
        tests:
          - not_null